<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.step-2 {
            max-width: 460px;
            box-shadow: 0 20px 45px rgba(255, 75, 110, 0.3);
        }
        .card.step-3 {
            max-width: 500px;
            padding-bottom: 40px;
            box-shadow: 0 25px 55px rgba(255, 75, 110, 0.4);
        }

        .photo-frame {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: none; 
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: heartBeat 1.4s infinite;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        h1 {
            color: #d81b60;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(45deg, #ff4b72 0%, #ff758c 100%);
            color: white;
            border: none;
            padding: 0 35px;
            height: 50px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
            z-index: 12;
        }
        .btn:hover {
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.5);
            transform: scale(1.02);
        }
        
        /* Исправленные стили для убегания кнопки */
        #btn-no {
            background: #999;
            box-shadow: none;
            /* Плавное скольжение при побеге */
            transition: top 0.2s ease, left 0.2s ease, transform 0.1s ease;
        }

        .secret-message {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #ffb3c1;
            color: #c2185b;
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.5;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .falling-heart {
            position: absolute;
            color: #ff4b72;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div class="photo-frame" id="photo-1" style="display: block;">
            <img src="photo1.jpg" alt="Наше фото 1">
        </div>
        
        <div class="photo-frame" id="photo-2">
            <img src="photo2.jpg" alt="Наше фото 2">
        </div>

        <span class="icon" id="card-icon">❤️</span>
        <h1 id="card-title">У меня к тебе вопрос...</h1>
        <p id="card-text">Ты же знаешь, как сильно ты мне дорога? Ответишь мне взаимностью?</p>
        
        <div class="btn-container" id="controls">
            <button class="btn" id="btn-yes" onclick="nextStep()">Да!</button>
            <button class="btn" id="btn-no" onmouseover="runAway()" onclick="runAway()">Нет</button>
        </div>
        
        <div class="secret-message" id="secret">
            Ура! Я очень сильно тебя люблю! ❤️<br>
            Ты — лучшее, что со мной случалось 🥰
        </div>
    </div>

    <audio id="bg-music" src="music.mp3" preload="auto" loop></audio>

    <script>
        let currentStep = 1;

        // Новая функция убегания по всему экрану
        function runAway() {
            const btnNo = document.getElementById('btn-no');
            
            // Переключаем кнопку в режим абсолютного позиционирования по всему окну
            btnNo.style.position = 'fixed';
            
            // Вычисляем случайные координаты в пределах видимого экрана (с отступами, чтобы не улетела за край)
            const padding = 100;
            const randomX = Math.random() * (window.innerWidth - btnNo.offsetWidth - padding) + padding / 2;
            const randomY = Math.random() * (window.innerHeight - btnNo.offsetHeight - padding) + padding / 2;
            
            // Назначаем новые координаты напрямую
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        function nextStep() {
            const card = document.getElementById('main-card');
            
            if (currentStep === 1) {
                currentStep = 2;
                card.classList.add('step-2');
                
                // Полностью убираем "Нет" и центрируем "Да"
                document.getElementById('btn-no').style.display = 'none';
                document.getElementById('controls').style.justifyContent = 'center';
                
                document.getElementById('photo-1').style.display = 'none';
                document.getElementById('photo-2').style.display = 'block';
                
                document.getElementById('card-title').innerText = "И еще кое-что... ✨";
                document.getElementById('card-text').innerText = "Ты готова провести со мной этот вечер?";
                document.getElementById('btn-yes').innerText = "Конечно да! 😍";
                
            } else if (currentStep === 2) {
                currentStep = 3;
                card.classList.add('step-3');
                
                const music = document.getElementById('bg-music');
                music.volume = 0.35;
                music.play().catch(err => console.log("Музыка ждет клика:", err));

                document.getElementById('controls').style.display = 'none';
                document.getElementById('card-text').style.display = 'none';
                document.getElementById('card-icon').style.display = 'none';
                
                document.getElementById('card-title').innerText = "Моё сердце принадлежит тебе!";
                document.getElementById('secret').style.display = 'block';
                
                startHeartAnimation();
            }
        }

        function startHeartAnimation() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('falling-heart');
                heart.innerHTML = '❤️';
                
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                heart.style.animationDuration = Math.random() * 3 + 3 + 's';
                heart.style.opacity = Math.random() * 0.5 + 0.5;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 150); 
        }
    </script>
</body>
</html>
